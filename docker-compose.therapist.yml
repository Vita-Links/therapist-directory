version: '3.8'

services:
  db:
    image: postgres:15
    container_name: therapist-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: therapist_directory
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: therapist-api
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://admin:adminpassword@db:5432/therapist_directory
    ports:
      - "8001:8001"
    volumes:
      - ./backend/uploads:/app/uploads

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"

  frontend:
    build: ./frontend
    container_name: therapist-frontend
    restart: always
    ports:
      - "3000:3000"

volumes:
  postgres_data:
